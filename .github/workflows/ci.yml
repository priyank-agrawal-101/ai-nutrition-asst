name: Software checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.9
        env:
          POSTGRES_USER: nutribite_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://nutribite_test:synthetic-ci-only@127.0.0.1:5432/postgres
      PLAYWRIGHT_BROWSERS_PATH: .cache/playwright
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.11.0
      - run: npm ci
      - run: npm run check
      - run: npm run test:integration
      - run: sudo apt-get update
      - run: sudo apt-get install -y postgresql-client-17
      - run: npm run test:restore
        env:
          POSTGRES_TOOLS_DIR: /usr/lib/postgresql/17/bin
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser-matrix
